name: Deploy GitHub Pages

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: Build site artifact
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Build examples
              run: |
                  clang -o nob nob.c
                  ./nob

            - name: Prepare Pages artifact
              run: |
                  rm -rf site
                  mkdir -p site/wasm site/fonts site/resources
                  cp index.html raylib.js site/
                  cp -R wasm/. site/wasm/
                  if [ -d fonts ]; then cp -R fonts/. site/fonts/; fi
                  if [ -d resources ]; then cp -R resources/. site/resources/; fi

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v4
