name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    format:
        name: Format checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile

            - name: Install clang-format
              run: sudo apt-get update && sudo apt-get install -y clang-format

            - name: Run formatting checks
              run: pnpm run format:check

    build:
        name: Native + WASM build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install clang-21 on macOS
              if: runner.os == 'macOS'
              run: |
                  brew update
                  brew install llvm@21
                  echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

            - name: Select compiler on macOS
              if: runner.os == 'macOS'
              run: |
                  echo "CC=$(which clang-21)" >> "$GITHUB_ENV"
                  echo "WASM_CC=$(which clang-21)" >> "$GITHUB_ENV"

            - name: Build with nob
              run: |
                  ${CC:-clang} -o nob nob.c
                  ./nob

            - name: Upload wasm artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: wasm-${{ matrix.os }}
                  path: wasm/*.wasm
                  if-no-files-found: error
