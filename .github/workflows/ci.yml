name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    format:
        name: Format checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Run formatting checks (Docker target)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: format-check
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    build:
        name: Native + WASM build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Set up Docker Buildx (Linux)
              if: runner.os == 'Linux'
              uses: docker/setup-buildx-action@v3

            - name: Build site artifacts (Linux)
              if: runner.os == 'Linux'
              run: |
                  rm -rf site
                  docker buildx build --target site --output type=local,dest=site .
                  rm -rf wasm
                  mkdir -p wasm
                  cp -R site/wasm/. wasm/

            - name: Install clang on macOS
              if: runner.os == 'macOS'
              run: |
                  if ! brew list llvm >/dev/null 2>&1; then
                    brew update
                    brew install llvm lld
                  fi
                  echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

            - name: Select compiler on macOS
              if: runner.os == 'macOS'
              run: |
                  echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
                  echo "WASM_CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"

            - name: Build with nob
              if: runner.os == 'macOS'
              run: |
                  ${CC:-clang} -o nob nob.c
                  ./nob

            - name: Upload wasm artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: wasm-${{ matrix.os }}
                  path: wasm/*.wasm
                  if-no-files-found: error
